# cargo-deny, dependency-graph security / license / source policy for inap.
# Local: `cargo deny check`  ·  CI: .github/workflows/audit.yaml
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
# A yanked crate or an open RustSec advisory fails the audit.
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
# inap's runtime deps are rasn + thiserror (pyo3 is optional, behind the
# `python` feature). No C libraries are linked, so there is no C-FFI ban list.

[licenses]
# The crate is MIT; keep dependencies OSI-permissive.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
